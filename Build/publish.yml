name: Publish npm package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        working-directory: build
        run: npm ci

      - name: Run build (minify + rollup bundle + ESM generation)
        working-directory: build
        run: node build.js

      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('ESM/package.json', 'utf8'));
            pkg.version = '$TAG_VERSION';
            fs.writeFileSync('ESM/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to npm
        working-directory: ESM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}